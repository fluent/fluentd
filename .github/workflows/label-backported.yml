name: Label Backported Pull Requests

on:
  pull_request_target:
    types: [closed]
    branches: ['v1.*']

permissions:
  contents: read

jobs:
  label:
    if: github.event.pull_request.merged == true
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    name: Add backported label to the original PRs
    steps:
      - name: Add backported label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          for number in $(printf '%s\n' "$PR_BODY" |
                            grep --only-matching --extended-regexp 'Backport #[0-9]+' |
                            grep --only-matching --extended-regexp '[0-9]+' |
                            sort --numeric-sort --unique); do
            echo "Add backported label to #$number"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" --raw-field 'labels[]=backported' > /dev/null
          done
